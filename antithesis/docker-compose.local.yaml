# Local overrides: SDK output to a file, a frequent quiet period, and QoS knobs.
services:
  driver:
    environment:
      ANTITHESIS_SDK_LOCAL_OUTPUT: /tmp/sdk.jsonl
      QUIET_P: "0.0002"
      MAX_SUB_QOS: ${MAX_SUB_QOS:-2}
      MAX_PUB_QOS: ${MAX_PUB_QOS:-2}
      MQTT_STRICT_QOS: ${MQTT_STRICT_QOS:-1}

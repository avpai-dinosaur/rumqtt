name: rumqtt

services:
  broker:
    image: ${REPOSITORY}/rumqttd:latest
    hostname: broker

  publisher:
    image: ${REPOSITORY}/rumqttc:latest
    hostname: publisher
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      CLIENT_ID: publisher
      ROLE: publisher
    depends_on:
      - broker

  subscriber:
    image: ${REPOSITORY}/rumqttc:latest
    hostname: subscriber
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      CLIENT_ID: subscriber
      ROLE: subscriber
    depends_on:
      - broker

[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
opt-level = 2
debug = 1

[dependencies]
hegeltest = { version = "0.52.0", features = ["static-engine"] }
antithesis_sdk = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

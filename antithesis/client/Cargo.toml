[package]
name = "antithesis-client"
version = "0.1.0"
publish = false
edition.workspace = true

[[bin]]
name = "client"
path = "asyncpubsub.rs"

[dependencies]
antithesis_sdk = "0.3.0"
rumqttc = { path = "../../rumqttc", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.36", features = ["rt", "macros", "sync", "time"] }
